# The core is pure Dart, so the same tests run on all three desktop OSes.
# No keys, network or installers are needed: tests and the example are offline.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch SDK or dependency changes
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
        if: matrix.os == 'ubuntu-latest'
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.os == 'ubuntu-latest'
      - run: dart test
      - run: dart run example/main.dart
      - run: dart run appcast_updater:appcast --lang en --help
      - run: dart pub publish --dry-run
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true   # readiness check only; warnings are recorded in the log
