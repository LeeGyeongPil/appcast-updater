# The core is pure Dart, so the same tests run on all three desktop OSes.
# No keys, network or installers are needed: tests and the example are offline.
# The SDK is pinned so that a new Dart release cannot turn an unchanged commit red;
# raise the pinned version in its own change after checking it locally.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash   # Git Bash on Windows, the same shell as a local run
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.8.1
      # pub.dev can have short outages: try once more after 15 seconds.
      - run: dart pub get || (sleep 15 && dart pub get)
      - run: dart analyze
        if: matrix.os == 'ubuntu-latest'
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.os == 'ubuntu-latest'
      - run: dart test --reporter expanded
      - run: dart run example/main.dart
      - run: dart run appcast_updater:appcast --lang en --help
      # Publishing readiness check only. It needs pub.dev and reports warnings,
      # so it never fails the job; the log keeps "Package has N warnings."
      - run: dart pub publish --dry-run || echo "::warning::dart pub publish --dry-run reported a problem, see the log above"
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
